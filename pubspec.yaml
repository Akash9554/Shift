name: shift
description: A new Flutter project.

publish_to: 'none'


version: 1.0.0+16

environment:
  sdk: '>=3.1.1 <4.0.0'


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  intl: ^0.20.2
  scrollable_positioned_list: ^0.3.2
  get_storage: ^2.0.3
  get: ^4.6.6
  get_it: ^8.0.3
  url_launcher: ^6.2.3
  http: ^1.1.2
  fluttertoast: ^8.2.4
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  flutter_widget_from_html: ^0.15.3
  change_app_package_name: ^1.1.0
  table_calendar: ^3.0.9
  flutter_easyloading: ^3.0.5
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  flutter_pdfview: ^1.0.4
  webview_flutter: ^4.10.0
  googleapis: ^13.1.0
  googleapis_auth: ^1.5.1
  firebase_app_installations: ^0.3.2+1
  flutter_local_notifications: ^18.0.1
  onesignal_flutter: ^5.2.9




dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0



flutter:


  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
       - asset: assets/fonts/poppinsthintalic.ttf
       - asset: assets/fonts/segoeprintfont.ttf
       - asset: assets/fonts/poppinssemiboldtalic.ttf
       - asset: assets/fonts/poppinsextrabolitalic.ttf
       - asset: assets/fonts/poppinsregular.ttf

    - family: Poppins_normal
      fonts:
       - asset: assets/fonts/poppinsregular.ttf
    - family: Poppins_sego
      fonts:
       - asset: assets/fonts/segoeprintfont.ttf
    - family: Poppins_semi
      fonts:
       - asset: assets/fonts/poppinsbold.ttf
    - family: Poppins_medium
      fonts:
       - asset: assets/fonts/poppinmedium.ttf
    - family: Trajan
      fonts:
       - asset: assets/fonts/aargh.ttf
    - family: open
      fonts:
       - asset: assets/fonts/opens.ttf

